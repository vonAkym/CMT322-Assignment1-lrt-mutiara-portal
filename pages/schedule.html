<section id="schedule" hidden><h1>Works schedule</h1><p class="mut">Ongoing and upcoming works by area. Each bar shows when the work runs over the next four weeks.</p>
<div class="sch-top"><div><label for="schz">Area</label><select id="schz" class="in" data-zones="All areas"></select></div>

<div id="schlist" class="stack" aria-live="polite"></div>
<p id="schempty" class="mut" hidden>No ongoing or upcoming works in this area.</p>
<div style="height:28px"></div></section>
